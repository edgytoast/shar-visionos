name: SHARVR
options:
  deploymentTarget:
    visionOS: "26.0"

# The launcher every Trevorbilt port shares, vendored here so everything the app runs is in this
# repository.
packages:
  TrevorbiltKit:
    path: ../TrevorbiltKit

targets:
  SHARVR:
    type: application
    platform: visionOS
    sources:
      - Sources
      # WindowFrame.usda, the Window view's materials.
      - Resources
      # The app icon, drawn by scripts/make-app-icon.py.
      - path: Assets.xcassets
      - path: build/EngineStamp.c
        optional: true
    # Xcode doesn't relink when only the -force_load'ed engine library changes (it isn't a tracked
    # link input), which silently runs a stale engine. This phase runs whenever the library
    # changes. It regenerates a tiny source file and deletes that file's object: Xcode doesn't
    # notice a source rewritten mid-build, but it does rebuild a missing object, and then relinks.
    preBuildScripts:
      - name: Engine build stamp
        script: |
          printf '// Generated by the "Engine build stamp" build phase from %s; do not edit.\nconst char SharEngineStamp[] = "%s";\n' \
            "$SCRIPT_INPUT_FILE_0" "$(stat -f '%m %z' "$SCRIPT_INPUT_FILE_0")" > "$SCRIPT_OUTPUT_FILE_0"
          for arch in $ARCHS; do rm -f "${OBJECT_FILE_DIR_normal:?}/$arch/EngineStamp.o"; done
        inputFiles:
          - $(SHAR_ENGINE_BUILD)/libshar_engine.a
        outputFiles:
          - $(SRCROOT)/build/EngineStamp.c
    # Signing, the bundle identifier, the entitlements (visionOS ends an app at a fixed memory
    # footprint; SHARVR.entitlements raises it) and where the engine was built: in SHARVR.xcconfig,
    # which each builder's Local.xcconfig overrides. Settings here would win over both.
    configFiles:
      Debug: SHARVR.xcconfig
      Release: SHARVR.xcconfig
    # Which commit the app was built from, for its About and Ports tabs: TBBuildCommit (the full
    # commit, "unknown" without git) and TBBuildDirty, a development build: one with uncommitted
    # changes, or from anything but a checkout of the public repository (whose name the release
    # fills in), since only its commits can be compared with its releases.
    postBuildScripts:
      # TODO: remove once the AVP Ports Index's live feed carries media (schema 1.4.0). Until then a
      # Debug build bundles the draft feed (DebugFixtures, which never goes into a release) so the
      # Ports tab can show its pictures on a headset; Release builds never have it.
      - name: Ports media fixture (Debug)
        basedOnDependencyAnalysis: false
        script: |
          fixture="$SRCROOT/DebugFixtures/ports-media-fixture.json"
          bundled="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ports-media-fixture.json"
          if [ "$CONFIGURATION" = "Debug" ] && [ -f "$fixture" ]; then cp "$fixture" "$bundled"; else rm -f "$bundled"; fi
      - name: Build commit
        basedOnDependencyAnalysis: false
        # So it runs after Xcode writes the app's Info.plist, not before (which would lose its keys).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          release_repo="$(printf '%s' 'edgytoast/shar-visionos' | tr '[:upper:]' '[:lower:]')"
          commit=unknown
          dirty=false
          if commit_found=$(git -C "$SRCROOT" rev-parse HEAD 2>/dev/null); then
            commit=$commit_found
            git -C "$SRCROOT" diff --quiet HEAD -- 2>/dev/null || dirty=true
            git -C "$SRCROOT" remote -v 2>/dev/null | tr '[:upper:]' '[:lower:]' |
              grep -qF -e "/$release_repo.git " -e "/$release_repo " -e ":$release_repo.git " -e ":$release_repo " || dirty=true
          fi
          /usr/libexec/PlistBuddy -c "Delete :TBBuildCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :TBBuildDirty" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :TBBuildCommit string $commit" -c "Add :TBBuildDirty string $dirty" "$plist"
    dependencies:
      - package: TrevorbiltKit
      - sdk: ARKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CompositorServices.framework
      - sdk: CoreAudio.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: libarchive.tbd
      - sdk: libc++.tbd
      - sdk: libz.tbd
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SHARVR-Bridging-Header.h
        # The window's scene mirror (MirrorScene.swift) walks every draw of every frame on the main
        # thread; unoptimised Swift took 17 ms an update at it. The engine is optimised already.
        SWIFT_OPTIMIZATION_LEVEL: -O
        HEADER_SEARCH_PATHS: $(SRCROOT)/../engine/code
        # Built by scripts/build.sh (scripts/build-engine-visionos.sh <tree> simulator|device), in
        # SHAR_WORKING_TREE (SHARVR.xcconfig).
        SHAR_ENGINE_BUILD[sdk=xrsimulator*]: $(SHAR_WORKING_TREE)/build/visionos-simulator
        SHAR_ENGINE_BUILD[sdk=xros*]: $(SHAR_WORKING_TREE)/build/visionos-device
        # The engine is built arm64-only; building needs a Mac with Apple silicon.
        EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
        # Force-load: the engine registers things from static constructors that a plain
        # static link would drop.
        OTHER_LDFLAGS: -force_load "$(SHAR_ENGINE_BUILD)/libshar_engine.a"
        # The game (srrmemory.cpp) and OpenAL Soft (almalloc.cpp) replace the global operator
        # new/delete. If the app binary exports them, dyld makes every framework in the process
        # use them too, and SwiftUI then frees memory through the game's allocator before it is
        # initialized. That crashed on device in radMemoryFindAllocatorRecursive. Unexported, they
        # cover only our own image, as upstream's do on Windows.
        UNEXPORTED_SYMBOLS_FILE: EngineUnexportedSymbols.txt
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SHAR VR
        INFOPLIST_KEY_NSWorldSensingUsageDescription: "Tracks your head so the game can be shown in stereo from where you are."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Automatic
        # The build-commit phase reads the repository's git state.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  SHARVR:
    build:
      targets:
        SHARVR: all
    run:
      config: Debug
      # Metal API validation and GPU frame capture, both on in Xcode's default scheme, add a great
      # deal of memory and CPU time with an engine drawing ~1,500 times a frame through MoltenVK,
      # and the headset ends the app at its memory limit. Turn them on here (or in the scheme
      # editor) only to chase a Metal bug.
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: disabled
    archive:
      config: Release
